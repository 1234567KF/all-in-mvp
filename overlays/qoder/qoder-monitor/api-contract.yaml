    # ============================================================
    CreateOptimizationRequest:
      type: object
      required:
        - opt_id
        - session_id
        - timestamp
      properties:
        opt_id:
          type: string
          maxLength: 100
          description: 优化记录 ID
        session_id:
          type: string
          description: 会话 ID
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 时间戳
        model_switched:
          type: boolean
          default: false
          description: 是否发生模型切换
        mechanisms:
          type: object
          description: 各机制节省明细
          properties:
            lean_ctx:
              type: integer
            l1_cache:
              type: integer
            l2_warmup:
              type: integer
            l3_skill_stub:
              type: integer
            ccp_skip:
              type: integer
            lambda_lang:
              type: integer
        turn_ids:
          type: array
          items:
            type: string
          description: 关联的轮次 ID 列表

    CreateOptimizationResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            opt_id:
              type: string
              description: 优化记录 ID
            saved_total:
              type: integer
              description: 总节省 Token

    OptimizationListResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  opt_id:
                    type: string
                  session_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  model_switched:
                    type: boolean
                  mechanisms:
                    type: object
                  saved_total:
                    type: integer

    OptimizationSummaryResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            mechanisms:
              type: object
              properties:
                lean_ctx:
                  type: integer
                l1_cache:
                  type: integer
                l2_warmup:
                  type: integer
                l3_skill_stub:
                  type: integer
                ccp_skip:
                  type: integer
                lambda_lang:
                  type: integer
            total_savings:
              type: integer
            model_switch_count:
              type: integer
            model_switch_savings:
              type: integer
            percentages:
              type: object

    # ============================================================
    # Pricing 相关 DTO
    # ============================================================
    PricingObject:
      type: object
      properties:
        model_id:
          type: string
          description: 模型 ID
        short:
          type: string
          nullable: true
          description: 模型简称
        name:
          type: string
          nullable: true
          description: 模型全名
        input_per_mtok:
          type: number
          format: float
          description: 输入价格（¥/M Token）
        output_per_mtok:
          type: number
          format: float
          description: 输出价格（¥/M Token）
        cache_read_per_mtok:
          type: number
          format: float
          description: 缓存读取价格（¥/M Token）
        note:
          type: string
          nullable: true
          description: 备注
        currency:
          type: string
          description: 货币符号

    UpdatePricingRequest:
      type: object
      properties:
        input_per_mtok:
          type: number
          format: float
          description: 输入价格（¥/M Token）
        output_per_mtok:
          type: number
          format: float
          description: 输出价格（¥/M Token）
        cache_read_per_mtok:
          type: number
          format: float
          description: 缓存读取价格（¥/M Token）
        note:
          type: string
          nullable: true
          description: 备注

    PricingListResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PricingObject'

    PricingDetailResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/PricingObject'

    # ============================================================
    # Timer 相关 DTO
    # ============================================================
    CreateTimerRequest:
      type: object
      required:
        - tool_call_id
        - tool_name
        - start_time
        - session_id
        - latency_ms
      properties:
        tool_call_id:
          type: string
          description: 工具调用 ID
        tool_name:
          type: string
          description: 工具名称
        start_time:
          type: integer
          description: 开始时间戳（毫秒）
        session_id:
          type: string
          description: 会话 ID
        latency_ms:
          type: integer
          minimum: 0
          description: 耗时（毫秒）

    CreateTimerResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            tool_call_id:
              type: string

    TimerObject:
      type: object
      properties:
        tool_call_id:
          type: string
        tool_name:
          type: string
        start_time:
          type: integer
        session_id:
          type: string
        latency_ms:
          type: integer

    TimerListResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TimerObject'

    # ============================================================
    # System 相关 DTO
    # ============================================================
    SystemActionResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            message:
              type: string
              description: 操作结果描述
            cleared_tables:
              type: array
              items:
                type: string
              description: 已清空的表名列表

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            status:
              type: string
              enum: [healthy]
            timestamp:
              type: string
              format: date-time
            db_connected:
              type: boolean
              description: 数据库连接状态
            db_size:
              type: integer
              description: 数据库文件大小（字节）
            turn_count:
              type: integer
              description: 当前轮次总数

    # ============================================================
    # Dashboard 相关 DTO
    # ============================================================
    DashboardSummaryResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            summary_cards:
              type: object
              properties:
                total_calls:
                  type: integer
                  description: 总调用次数
                total_input_tokens:
                  type: integer
                  description: 总输入 Token
                cache_hit_rate:
                  type: number
                  format: float
                  description: 缓存命中率
                total_output_tokens:
                  type: integer
                  description: 总输出 Token
                model_switch_count:
                  type: integer
                  description: 模型切换次数
                model_count:
                  type: integer
                  description: 使用模型种类数
                estimated_cost:
                  type: number
                  format: float
                  description: 估算总成本
                total_savings:
                  type: integer
                  description: 优化节省 Token
                currency:
                  type: string
                  description: 货币符号
            model_distribution:
              type: array
              items:
                type: object
                properties:
                  model:
                    type: string
                  call_count:
                    type: integer
                  percentage:
                    type: number
                    format: float
            cost_breakdown:
              type: array
              items:
                type: object
                properties:
                  model:
                    type: string
                  call_count:
                    type: integer
                  input_cost:
                    type: number
                    format: float
                  output_cost:
                    type: number
                    format: float
                  total_cost:
                    type: number
                    format: float
            savings_breakdown:
              type: object
              properties:
                mechanisms:
                  type: object
                total_savings:
                  type: integer
            recent_turns:
              type: array
              items:
                $ref: '#/components/schemas/TurnObject'
              description: 最近 50 条轮次列表
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionObject'
              description: 会话列表

    # ============================================================
    # 通用错误 DTO
    # ============================================================
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 错误码
              enum:
                - BAD_REQUEST
                - NOT_FOUND
                - VALIDATION_ERROR
                - CONFLICT
                - INTERNAL_ERROR
                - DB_ERROR
                - RATE_LIMITED
                - NO_PRICING
            message:
              type: string
              description: 用户可读的错误描述
            details:
              type: object
              nullable: true
              description: 详细错误信息（开发模式）

# 功能点覆盖清单
# F-001: POST /api/turns (用户输入记录)
# F-002: POST /api/turns (AI 回复记录)
# F-003: POST /api/turns (A2A 消息记录, type=a2a)
# F-004: POST /api/optimizations (优化节省记录)
# F-005: GET /api/dashboard/summary (实时看板)
# F-006: GET /api/sessions, GET /api/sessions/:id (会话管理)
# F-007: GET /api/turns/stats (Token 统计)
# F-008: GET /api/turns/cost, GET /api/pricing (成本估算)
# F-009: GET /api/turns/savings, GET /api/optimizations/summary (优化节省)
# F-010: 后端 Service 生成 (Markdown 报告)
# F-011: 后端 Service 生成 (HTML 看板)
# F-012: DELETE /api/data (数据重置)
# F-013: GET /api/health (健康检查)

