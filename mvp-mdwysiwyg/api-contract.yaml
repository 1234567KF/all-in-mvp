# api-contract.yaml — Extension Host ↔ WebView 消息契约

> **版本**: v1.0  
> **状态**: 【锁定版】  
> **协议**: VS Code postMessage (JSON)

---

info:
  title: MD WYSIWYG Reader Message Contract
  version: 1.0.0
  description: Extension Host 与 WebView 之间的双向消息协议

# ============================================================
# 通用消息格式
# ============================================================
schemas:
  VsMessage:
    type: object
    required: [type, payload]
    properties:
      type:
        type: string
        description: 消息类型标识
      payload:
        type: object
        description: 消息载荷
      requestId:
        type: string
        description: 可选的请求关联 ID

  Heading:
    type: object
    required: [id, level, text]
    properties:
      id:
        type: string
        description: 标题锚点 ID (slug 化)
      level:
        type: integer
        minimum: 1
        maximum: 6
      text:
        type: string
        description: 标题纯文本（无 Markdown 标记）
      children:
        type: array
        items:
          $ref: '#/schemas/Heading'

  Token:
    type: object
    description: markdown-it Token
    properties:
      type:
        type: string
      tag:
        type: string
      nesting:
        type: integer
      content:
        type: string
      children:
        type: array
      attrs:
        type: array
      map:
        type: array
        items:
          type: integer

  DiffChange:
    type: object
    required: [id, type, elementType]
    properties:
      id:
        type: string
        description: 唯一标识
      type:
        type: string
        enum: [insert, delete, modify]
      position:
        type: object
        properties:
          sectionId:
            type: string
            description: 所属章节的 heading ID
          line:
            type: integer
          column:
            type: integer
      oldText:
        type: string
        description: 修改/删除时的原始文本
      newText:
        type: string
        description: 修改/新增时的新文本
      elementType:
        type: string
        enum: [heading, paragraph, table-cell, code-block, image, list-item, mermaid-block]
      accepted:
        type: boolean
        default: false

  DiffStats:
    type: object
    properties:
      inserted:
        type: integer
      deleted:
        type: integer
      modified:
        type: integer

  Revision:
    type: object
    required: [id, timestamp, triggerer, changes, stats, status]
    properties:
      id:
        type: string
      timestamp:
        type: string
        format: date-time
      triggerer:
        type: string
        enum: [ai, human]
      changes:
        type: array
        items:
          $ref: '#/schemas/DiffChange'
      stats:
        $ref: '#/schemas/DiffStats'
      status:
        type: string
        enum: [pending, accepted, rejected]

  BaseVersion:
    type: object
    properties:
      content:
        type: string
      markedAt:
        type: string
        format: date-time
      filePath:
        type: string

  RevisionStore:
    type: object
    properties:
      version:
        type: integer
        const: 1
      filePath:
        type: string
      baseVersion:
        oneOf:
          - $ref: '#/schemas/BaseVersion'
          - type: 'null'
      revisions:
        type: array
        items:
          $ref: '#/schemas/Revision'

# ============================================================
# Extension → WebView 消息
# ============================================================
extension_to_webview:
  document_loaded:
    type: document:loaded
    description: 文档加载完成，发送内容和解析结果
    payload:
      content:
        type: string
        description: Markdown 原始内容
      headings:
        type: array
        items:
          $ref: '#/schemas/Heading'
        description: 标题树
      revisionStore:
        $ref: '#/schemas/RevisionStore'

  document_changed:
    type: document:changed
    description: 文件外部修改触发
    payload:
      content:
        type: string
      headings:
        type: array
        items:
          $ref: '#/schemas/Heading'

  diff_result:
    type: diff:result
    description: Diff 计算完成
    payload:
      changes:
        type: array
        items:
          $ref: '#/schemas/DiffChange'
      stats:
        $ref: '#/schemas/DiffStats'

  revision_updated:
    type: revision:updated
    description: 修订记录更新
    payload:
      revisions:
        type: array
        items:
          $ref: '#/schemas/Revision'
      baseVersion:
        oneOf:
          - $ref: '#/schemas/BaseVersion'
          - type: 'null'

  save_success:
    type: document:saveSuccess
    description: 保存成功确认
    payload:
      timestamp:
        type: string
        format: date-time

  error:
    type: error
    description: 错误通知
    payload:
      code:
        type: string
      message:
        type: string

# ============================================================
# WebView → Extension 消息
# ============================================================
webview_to_extension:
  ui_ready:
    type: ui:ready
    description: WebView 渲染就绪，请求加载文档
    payload: {}

  document_save:
    type: document:save
    description: 请求保存文档
    payload:
      content:
        type: string
        description: 序列化后的 Markdown 内容

  document_requestDiff:
    type: document:requestDiff
    description: 请求计算 Diff
    payload:
      v0:
        type: string
        description: 基准版本内容
      v1:
        type: string
        description: 当前版本内容

  revision_accept:
    type: revision:accept
    description: 接受单条修订
    payload:
      changeId:
        type: string

  revision_reject:
    type: revision:reject
    description: 拒绝单条修订
    payload:
      changeId:
        type: string

  revision_acceptAll:
    type: revision:acceptAll
    description: 全部接受
    payload: {}

  revision_rejectAll:
    type: revision:rejectAll
    description: 全部拒绝
    payload: {}

  revision_setBase:
    type: revision:setBase
    description: 设为基准版本
    payload:
      content:
        type: string

  revision_clearBase:
    type: revision:clearBase
    description: 清除基准
    payload: {}

  outline_navigate:
    type: outline:navigate
    description: 大纲跳转（WebView 内自行处理，可选通知 Extension）
    payload:
      headingId:
        type: string

  outline_reorder:
    type: outline:reorder
    description: 大纲拖拽重排，需要同步源文件
    payload:
      fromId:
        type: string
      toId:
        type: string
      newContent:
        type: string
        description: 重排后的完整 Markdown 内容

# ============================================================
# 错误码
# ============================================================
error_codes:
  FILE_NOT_FOUND:
    code: FILE_NOT_FOUND
    message: 文件不存在
    httpEquivalent: 404

  PARSE_ERROR:
    code: PARSE_ERROR
    message: Markdown 解析失败
    httpEquivalent: 422

  DIFF_ERROR:
    code: DIFF_ERROR
    message: Diff 计算失败
    httpEquivalent: 500

  SAVE_ERROR:
    code: SAVE_ERROR
    message: 文件保存失败
    httpEquivalent: 500

  REVISION_IO_ERROR:
    code: REVISION_IO_ERROR
    message: 修订记录读写失败
    httpEquivalent: 500

  MERMAID_RENDER_ERROR:
    code: MERMAID_RENDER_ERROR
    message: Mermaid 图表渲染失败
    httpEquivalent: 422

  INVALID_MESSAGE:
    code: INVALID_MESSAGE
    message: 消息格式不合法
    httpEquivalent: 400
