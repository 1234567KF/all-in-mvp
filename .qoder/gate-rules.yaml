  # ---- v2.25 规则（借鉴 starters/liquid-glass-starter：AST 可判定的走 ESLint，跨文件不变量才留给 arch:check）----
  - id: R029
    version: v2.25
    name: 技能/Agent frontmatter 严格 YAML 校验
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: scripts/check-skill-frontmatter.ps1
    applies_to: [all]
    description: |
      SKILL.md / agents/*.md 的 frontmatter 必须能被严格 YAML 解析器读通。
      致命形态：plain scalar 内含 ": "（如 description 写 "Triggers: A, B. NOT for: C."）
      → YAML 报 mapping values are not allowed here → 整块 frontmatter 作废。
      后果不对称：App 侧技能列表会静默 omit 该技能，Agent 侧加载器却仍能激活它，
      于是出现"看起来装了，实际没注册"（血案 B024，门面技能 all-in-mvp 曾长期命中）。
      同时校验：UTF-8 BOM、引号未闭合、Tab 缩进、name/description 缺失、frontmatter 未闭合。
      已声明盲区（本脚本是行级近似，不是完整 YAML 解析器）：
        1) 不解析多行 plain scalar 折叠后的真实值，只按行判形态；
        2) 嵌套 flow 集合的内层未闭合看不全；
        3) 引号内转义引号（"a \" b"）可能误判为未闭合；
        4) 只覆盖 .qoder/skills/*/SKILL.md、.qoder/agents/*.md、starters/*/.agents/skills/*/SKILL.md 三类路径，
           更深目录的 SKILL.md 需 -IncludeHomes 或手工扩路径；
        5) 语义正确性（触发词是否合理、描述是否准确）不在范围 — 由 kf-skill-design-expert 负责。
      最终裁决用真解析器复核：uv run --no-project --with pyyaml python -c "import yaml,io;yaml.safe_load(...)"。
      关联：hooks.PostToolUse → quality-gate-hook.ps1 Gate 0 会在编辑 SKILL.md 后直接跑本脚本。

  - id: R030
    version: v2.25
    name: UI 窄屏分叉禁用 window.innerWidth
    severity: HIGH
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：project-rules/no-raw-viewport-check（apps/web pages/components = error）
    applies_to: [frontend-dev]
    description: |
      窄屏结构分叉 MUST 走单一真源 useIsMobile()（@/hooks/use-mobile，md/768px）或 Tailwind 断点类；
      触摸能力检测走 pointer-coarse。直读 window.innerWidth 会制造 640/768/1024 混用、且不响应 resize。
      已声明盲区（lint 绿 ≠ 响应式规范已满足）：
        1) 别名/其它全局：`const w = window; w.innerWidth`、`globalThis.innerWidth` 拦不到；
        2) 其它宽度来源：clientWidth、matchMedia("(max-width: …)")、offsetWidth 不在范围；
        3) 只治 innerWidth，innerHeight 分叉不拦；
        4) 仅 pages/ 与 components/ 启用，layouts/ 与 hooks/ 默认不检查。
      永久豁免需附理由与移除条件，见 starters/liquid-glass-frontend/eslint.config.js
      （错误页鼠标视差的坐标归一化已按此登记）。

  - id: R031
    version: v2.25
    name: 禁止截断 UTC ISO 字符串取日期
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：project-rules/no-toisostring-slice（全仓 warn，违规即修）
    applies_to: [frontend-dev, backend-tdd]
    description: |
      禁止 .toISOString().slice/substring/substr/split —— toISOString() 返回 UTC，
      截断取日期在 UTC+ 时区会把日期往前挪一天（UTC+8 的 00:00 → 前一日 16:00Z）。
      替代：展示用 formatDate()（apps/web/src/lib/date-utils）、日期范围用
      getLocalDayBoundaryISO(d, "start"|"end")、查询参数传完整 ISO 不截断。
      已声明盲区：
        1) 跨语句拆分 `const iso = d.toISOString(); iso.slice(0,10)` AST 上拦不到；
        2) 其它 UTC 来源（Date.UTC、getUTCXxx 手搓拼接）不在范围；
        3) apps/api 无 @/ 别名，date-utils 仅存在于 apps/web —— api 侧需传完整 ISO 或下沉到 packages/shared。
      前两类由 code-review 与 date-utils 的时区不变量测试兜底。

  # ---- v2.26 规则（同步权威 starter 167d77c 后新增：契约/审计不变量由 starter ESLint 承担，本文件只登记 + 声明盲区）----
  - id: R032
    version: v2.26
    name: UI 层禁止值导入 services 层
    severity: HIGH
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：project-rules/no-service-import-in-ui（pages/components = error）
    applies_to: [frontend-dev]
    description: |
      服务端数据必须经 TanStack Query hooks（apps/web/src/hooks/queries/，queryKey 来自 lib/query-keys.ts）。
      pages/components 里 import 具体 service 函数会绕过缓存、失效与统一错误处理，重新引入散落的 fetch useEffect。
      type-only 导入允许（不产生运行时依赖）。
      已声明盲区（lint 绿 ≠ 服务层隔离已满足）：
        1) 只访问 ImportDeclaration —— `export { x } from "@/services/x"` 转承与 `await import()` 动态导入拦不到；
        2) 别名前缀带尾斜杠：`import s from "@/services"`（barrel 目录）与其它别名（~/services）不匹配；
        3) require() 形式不覆盖（本仓 ESM，风险低）；
        4) 作用域仅 pages/**.tsx 与 components/**.tsx，写在 hooks/ 下的取值逻辑不在范围。
      上述 4 类已作为 valid 用例钉在 eslint-rules/no-service-import-in-ui.test.js，规则收紧时会变红。

  - id: R033
    version: v2.26
    name: 写审计的导出 service 函数首参必须为 OpCtx
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：project-rules/no-audit-fn-without-opctx（modules/**/*.service.ts = error，排除 *.test.ts）
    applies_to: [backend-tdd, code-reviewer]
    description: |
      OpCtx（operatorId/operator/operatorAccount/operatorRole/ipAddress/userAgent/requestId）是审计身份的唯一载体。
      未认证入口（登录/注册/改密）也必须拿 OpCtx：只挂 opCtxMiddleware 不挂 authMiddleware 取空壳，再覆盖身份字段。
      身份取值按"可解析优先"：能解析出真实用户就用真实值，只有解析不出（登录失败/未知账号/限流锁定）才回退到声明值。
      审计调用必须整体展开 `{ ...ctx }`，禁止逐字段手工拼装 ip/ua/requestId ——
      真实事故是 refresh 路径手搓出 requestId: ""，令牌复用的安全事件再也关联不回发起请求。
      已声明盲区：只检查直接调用 auditor 的**导出**函数签名；把 auditor 包进本地闭包再调、
      非导出辅助函数写审计、以及"身份字段填得对不对"都不在 lint 范围，由类型设计 + code-review 兜底。

  - id: R034
    version: v2.26
    name: 禁裸调 writeLog，handler 默认禁手写 hasPermission
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 内置 no-restricted-syntax 承担（两个 esquery 选择器）
    applies_to: [backend-tdd, code-reviewer]
    description: |
      写日志只能走 auditedInsert/Update/Delete 或 createAuditor(module)；
      路由鉴权默认走 requirePermission/requireRole/requireAdmin，资源级/字段级/依赖业务状态的授权下沉到 service 领域方法。
      handler 里确需手写 hasPermission 的例外必须 eslint-disable-next-line 并附理由
      （reportUnusedDisableDirectives = error 保证豁免修好后必须删，不留僵尸豁免）。
      已声明盲区：选择器是 CallExpression[callee.name="writeLog"/"hasPermission"]，
      因此 logger.writeLog(...) 成员调用、`import { writeLog as log }` 别名转承、
      以及 const w = writeLog 后的间接调用都不在拦截范围；权限语义正确性由 mvp-code-reviewer 审查。

  - id: R035
    version: v2.26
    name: 前置可交互双分支门禁（正常分支 + 异常分支清单）
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 mvp-verifier 的 MSVP 协议 + 真实浏览器执行清单承担，不适合静态扫描
    applies_to: [verifier, stage4-coordinator, pipeline-coordinator, backend-tdd, frontend-dev]
    description: |
      v2.26 去前后端分离后的替代验收机制：不再有"原型在 Mock 上确认"这一档，
      改为在真实后端 + 真实数据库上做**前置可交互**双分支走查。
      硬要求：
        1) 每模块 <module>.md 必须同时有【正常分支清单】与【异常分支清单】，异常至少覆盖
           400 逐字段校验 / 401 未认证与令牌过期 / 403 越权 / 404 不存在 / 409 唯一约束冲突 /
           空数据态 / 超长与特殊字符 / 后端 5xx 或断网时的前端表现；
        2) 每条异常分支必须有**可复现触发方式**：demo-seed 预置数据，或 dev-only 造数端点
           （starter 形态：POST /notifications/dev/push、POST /notifications/dev/reset，
           非 development/test/DEMO_MODE 一律 404 —— 造数端点禁止进生产）；
        3) 走查在真实浏览器里做，不是看代码或看测试绿；
        4) 清单未 100% 走完 → 禁止进入 Stage 4.3；某条不可复现 → BLOCKED(造数缺失)，
           禁止用 Mock 或"逻辑上应该没问题"充数。
      已声明盲区：清单本身的完备性靠 mvp-domain-expert 与 mvp-grill-review，不是靠静态检查；
      "点了但没看出问题"的假通过靠 MSVP 的 A 类 Bug 判据兜底，仍可能漏；
      造数端点是否真的 404 取决于部署环境配置正确，本规则不自动验 env 值。
      立规依据（血案级实证）：权威 starter 的 changePassword 打到不存在的路由，
      真实 curl 404，而 270 个前端单测全绿 —— mock 掉的 axios 把错误字面量断成"正确路径"。
      Mock 层永远抓不到这类问题，因为 mock 是按前端期望写的。

  - id: R036
    version: v2.27
    name: route 层禁止直连数据库
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：eslint.config.js 的 route 块（no-restricted-imports + no-restricted-syntax），断言见 eslint-rules/route-db-guard.test.js
    applies_to: [backend-tdd, code-reviewer]
    description: |
      v2.27 从权威 starter 同步的门禁：查询/写入与业务规则必须下沉到同模块 *.service.ts，
      *.route.ts 保持薄 handler（只解析请求、调 service、mapServiceError、返回 ok/fail）。
      拦截面：静态 import / re-export / import type / 动态 import() / require() 五种形态，
      命中 **/db*、drizzle-orm、drizzle-orm/sqlite-core、bun:sqlite。
      只读 route（如 modules/log）同样受约束——service 负责 SQL，不接 OpCtx。
      已声明盲区：只约束 route 层文件，service 里直连 DB 是设计允许的；
      通过 `import * as db from "../../db.js"` 的 namespace 导入能拦住（走 no-restricted-imports 的路径匹配），
      但把 getDrizzle 结果存进模块级变量再在别处使用不在检查范围；
      "路由里塞业务逻辑"本身不由本规则判定，靠 mvp-code-reviewer。

  - id: R037
    version: v2.27
    name: 业务模块禁止直连对象存储 SDK
    severity: HIGH
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：eslint.config.js api modules 块（no-restricted-imports + no-restricted-syntax），断言见 eslint-rules/api-oss-import-guard.test.js
    applies_to: [backend-tdd, code-reviewer]
    description: |
      上传/下载统一走 apps/api/src/shared/oss.ts 双模封装：
      OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_BUCKET 三者同时配置才启用 OSS 模式，
      否则自动降级本地 mock 存储（mock 的本地回退路由由业务方传入 MockOssRoutes）。
      业务模块直连 ali-oss 会让"无凭证环境跑不通"变成集成期才爆炸的缺陷，
      也绕过 UPLOAD_MAX_SIZE_MB 的统一上限。
      模块测试文件放行（允许 mock SDK）；shared/oss.ts 是唯一合法入口。
      已声明盲区：只拦 import 形态，运行期通过依赖注入拿到的 client 不检查；
      审计与权限由调用方 service 自行决定，本规则不判"该不该审计"；
      SQLite 运维（shared/sqlite-ops.ts：stats / VACUUM INTO / 热备）没有对应 import 门禁，零表依赖但也靠评审兜底。

  - id: R038
    version: v2.27
    name: 前端权限只消费 wire 下发的 user.permissions
    severity: BLOCKER
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter ESLint 承担：eslint.config.js web 块（no-restricted-imports，importNames），断言见 eslint-rules/web-permission-import-guard.test.js
    applies_to: [frontend-dev, code-reviewer, verifier]
    description: |
      apps/web/src/** 禁止 import ROLE_PERMISSIONS / ALL_PERMISSIONS / permissionsForRole 自行推导角色。
      唯一数据源：登录成功时写入 auth store 的 user.permissions: string[]
      （GET /users/me 同样返回但不回写 store；refresh 只旋转 token、不刷新角色）。
      消费方式：usePermission().can/canAny 或 <PermissionGate perm={PERMISSIONS.X}>；
      menu-config.ts 的 MenuItem.permission 由侧边栏与 ⌘K 自动过滤，不填默认全员可见。
      与 R035 双分支直接相关：前端自行推导 = 权限矩阵的第二真相源，
      "看起来没权限但后端其实放行"（或反之）在 Mock/单测里永远发现不了。
      已声明盲区：namespace import（import * as shared 后取 shared.ROLE_PERMISSIONS）不受 importNames 约束，靠评审兜底；
      只拦值导入形态，re-export 已覆盖但 `const {ROLE_PERMISSIONS} = await import("shared")` 走不到；
      **导航隐藏 ≠ 鉴权**——页面/接口的真实权限仍由后端 requirePermission 把关，本规则不验后端配得对不对。

  - id: R039
    version: v2.27
    name: 单文件 450 行棘轮（只许减不许增）
    severity: HIGH
    stage: [stage3, stage4, fix]
    check_script: null  # 由 starter arch:check 承担：scripts/arch-check.ts 的 MAX_LINES + LONG_FILE_RATCHET
    applies_to: [backend-tdd, frontend-dev, code-reviewer]
    description: |
      作用域：apps/web/src/pages 下 .tsx + apps/api/src/modules/**/*.ts；口径同 wc -l，硬上限 450 行。
      存量超长文件进 LONG_FILE_RATCHET 白名单，行数必须等于基线：
        overlong-ratchet-exceeded（回涨）/ -stale（已达标未移除条目）/ -unlowered（低于基线未下调）/ -missing（条目指向不存在的文件）。
      软线 400 行触发拆分，拆分对象是自包含大块（弹窗/表单体 → pages/<module>/components/，
      表单与业务逻辑 → pages/<module>/hooks/），不为凑行数硬拆小块。
      与流水线关系：纵向切片让单模块前后端代码由同一 Agent 产出，超长文件是"切片粒度太大"的信号，
      应回到 Coordinator 重新拆模块边界，而不是继续堆。
      已声明盲区：白名单按模板 demo 页路径写死，scaffold 生成项目靠 pruneMissingLongFileRatchet() 剪枝，
      helper 依赖 `const LONG_FILE_RATCHET` 字面量与单行条目格式，改这两个形态需同步改 helper；
      行数不衡量圈复杂度与职责混杂，一个 450 行的上帝文件照样能过；
      Windows 下路径必须先 toPosix 再比白名单键，否则条目全部误判为 -missing。

  - id: R040
    version: v2.28
    name: 内部引用脱敏
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-private-refs.ps1
    applies_to: [stage4-coordinator, code-reviewer]
    description: |
      本仓与从上游继承的文档/CI 配置不得出现自建内网坐标：内网网段内的主机地址（IPv4 及其
      百分号编码、横线/下划线变体，具体登记表在 check-private-refs.ps1 的 INTERNAL_*_PATTERNS，
      本文件不复述字面量以免检查器自身成为违规样本）、内网 GitLab 主机别名，以及未替换的
      真实 webhook 令牌路径。
      替代形态：① RFC 2606 占位域（example.com / gitlab.example.com）；② CI/环境变量注入
      （.gitlab-ci.yml 的 variables 声明 + CI Variables 覆盖，脚本侧用 `${TEST_HOST:?}` 强制校验）；
      ③ 公网云服务商地址（如公共镜像仓库命名空间）不属于本规则范围，可保留，但需在提交说明里点名保留项。
      确需保留的例外：同行写 `R040-allow: <理由>`，无理由的放行标记仍判 FAIL；
      该标记只在确实命中内网坐标的行上生效，因此规则文档里引用标记的示例行不会被算作放行。
      其它 RFC1918 字面量（文档示例、测试夹具里的 10.x / 192.168.x）判 WARN 单独计数，不阻断。
      「一个文件都没扫到」判 SKIPPED 且退出码 2 —— 聚合脚本按非 0 计入 FAIL，不得当成 PASS（B022）。
      已声明盲区：① 只匹配 IPv4 点分及其分隔符/百分号变体，未登记的新内网主机名不在范围内；
      ② 二进制/图片内嵌字符串；③ 拆进多个变量拼接后单行不成形的绕过（同 R010 盲区①）；
      ④ 改写数值进制（八进制/十六进制/无点单整数）不成形，靠代码评审兜底而非正则；
      ⑤ 扫描清单来自 git ls-files，未入库的本地文件不在范围；
      ⑥ 门禁脚本自身也在扫描范围内：注释与文档不得写出完整内网 IP 字面量，否则「提交即自毁红」
      （已实测：脚本未入库时扫不到自己，git add 后才会自命中——所以必须在暂存后复跑验证）。

