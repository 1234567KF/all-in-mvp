    name: 枚举值唯一真源
    severity: BLOCKER
    stage: [stage3, stage4]
    check_script: null  # 需语义分析，暂不可脚本化
    applies_to: [frontend-dev, backend-tdd]
    description: |
      后端 zod schema 中的 z.enum([...]) 是唯一真源。
      前端 MUST 从 api-contract.yaml 或后端 schema 提取枚举值，严禁自行发明。

  - id: R003
    version: v2.8
    name: E2E 必须穿透代理层
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-e2e-proxy.ps1
    applies_to: [kf-mvp-test-e2e]
    description: |
      E2E 测试 MUST 通过前端开发服务器的代理层访问后端，严禁直连后端端口。

  - id: R004
    version: v2.8
