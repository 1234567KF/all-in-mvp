    severity: HIGH
    stage: [stage3, stage4]
    check_script: null
    applies_to: [frontend-dev, kf-mvp-test-e2e]
    description: |
      所有测试 MUST 使用与前端统一请求实例相同的配置，不得用裸 fetch/axios 绕过拦截器。

  # ---- v2.12 规则 ----
  - id: R005
    version: v2.12
    name: E2E 浏览器交互配额
    severity: BLOCKER
    stage: [stage3.5, stage4]
    check_script: scripts/check-e2e-browser-quota.ps1
    applies_to: [kf-mvp-test-e2e]
    quantifier:
      metric: "page.fill/click/goto 占比"
      threshold: "≥ 30%"

  - id: R006
    version: v2.12
    name: 权限交叉矩阵必测
    severity: BLOCKER
    stage: [stage3.5, stage4]
    check_script: scripts/check-e2e-permission-matrix.ps1
    applies_to: [kf-mvp-test-e2e]
    description: |
      多角色项目必须生成角色×端点组矩阵，每个交叉格 = 1 条必写用例（含预期 403 格）。

  - id: R007
    version: v2.12
    name: 状态双向断言
    severity: HIGH
    stage: [stage3.5, stage4]
    check_script: null  # 语义分析
    applies_to: [kf-mvp-test-e2e]
    description: |
      每次状态转换必须同时验证"target 出现"和"source 消失"。

  - id: R008
    version: v2.12
    name: 断言质量门禁
    severity: HIGH
    stage: [stage3.5, stage4]
    check_script: null  # 语义分析
    applies_to: [kf-mvp-test-e2e, test-review]
    description: |
      禁止 expect([200,403]).toContain(status) 宽松断言、禁止只判状态码不判内容。

