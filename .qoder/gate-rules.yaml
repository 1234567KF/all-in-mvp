# ============================================================
# Gate Rules Registry — AI 行为规约单一真源
# ============================================================
# 用途：
#   1. 门禁脚本从此文件读取规则定义，无需重复
#   2. Agent 文件通过 rule ID 引用，不再内嵌规则全文
#   3. SKILL.md 通过此表生成精简引用
#
# 新增规则流程：
#   1. 在此文件新增一条 rule 记录
#   2. 编写对应的 check_script（如可自动化）
#   3. 在适用的 agent Constraints 中加一行引用：`@rule:Rxxx`
#   4. 血案写入 PLAYBOOK.md
# ============================================================

