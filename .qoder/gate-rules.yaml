      E2E @headed 测试 MUST 包含至少 1 条"打开创建/编辑弹窗 + 验证下拉/选择器出现选项"用例。

  - id: R014
    version: v2.14
    name: API 端点存在性交叉校验
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-api-endpoints.ps1
    applies_to: [stage4-coordinator]
    description: |
      Stage 4.2 联调前 MUST 提取前端所有 api.get/post/put/delete(url) 调用路径，
      与 contract + Mock routes + 真实后端 routes 三方交叉比对。

  - id: R015
    version: v2.14
    name: 禁止静默吞错误
    severity: BLOCKER
    stage: [stage3, stage4]
    check_script: scripts/check-silent-catch.ps1
    applies_to: [frontend-dev]
    description: |
      .catch(() => {}) 空回调是反模式，MUST 至少 console.warn(err) 或显示友好提示。
      所有 fetch/axios 调用链必须有 error 处理策略。

  - id: R016
    version: v2.14
    name: CI 门禁端点一致性扫描
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-api-endpoints.ps1  # 与 R014 共用
    applies_to: [stage4-coordinator]
    description: |
      Stage4 验收前 MUST 执行自动化端点一致性扫描，任一路径三处均无 → 门禁失败。

  # ---- v2.16 规则（反模式雷达 — 技能内化）----
  - id: R017
    version: v2.16
    name: 集成点全链路检查
    severity: BLOCKER
    stage: [stage4]
    check_script: null  # 需语义分析，暂不可脚本化
    applies_to: [stage4-coordinator, architect]
    description: |
      跨模块功能必须显式列出集成点链路：数据层(后端service) → 判断层(store/composable) → 渲染层(组件)。
      每层分配唯一 owner。Stage 4 联调时验证三层全部存在且正确连接。
      任一缺失 → 标记 INTEGRATION_GAP，回退对应 Agent 修复。
      血案见 PLAYBOOK.md B015（侧边栏权限过滤未实现）。

  - id: R018
    version: v2.16
    name: UI 数据源绑定
    severity: BLOCKER
    stage: [stage3, stage4]
    check_script: null  # 需语义分析，暂不可脚本化
    applies_to: [frontend-dev]
    description: |
      所有显示用户姓名、角色标签、权限判断的 UI 组件 MUST 从 auth store（如 useAuthStore）读取动态数据。
      严禁硬编码 "ADMIN"、"管理员"、"超级管理员" 等字符串。
      血案见 PLAYBOOK.md B016（UserMenu 硬编码 "ADMIN"）。

  - id: R019
    version: v2.16
    name: 服务器响应权威数据源
    severity: HIGH
    stage: [stage3, stage4]
    check_script: null  # 需语义分析，暂不可脚本化
