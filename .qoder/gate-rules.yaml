  - id: R009
    version: v2.13
    name: E2E 双模验收
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-e2e-dual-mode.ps1
    applies_to: [stage4-coordinator, kf-mvp-test-e2e, msvp-verifier]
