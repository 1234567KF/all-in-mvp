  - id: R001
    version: v2.8
    name: 响应格式标准化
    severity: BLOCKER
    stage: [stage4]
    check_script: scripts/check-response-format.ps1
    applies_to: [backend-tdd, stage4-coordinator]
    description: |
      所有列表类端点 MUST 返回 { data: { list: [...], total: N } }。
      前端 axios 响应拦截器 MUST 自动解包后端的 { data: ... } 包裹层。

  - id: R002
