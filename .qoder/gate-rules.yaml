    name: 端口配置化
    severity: BLOCKER
    stage: [stage2]
    check_script: scripts/check-port-config.ps1
    applies_to: [architect]
    description: |
      标准端口 API=3333、WEB=5555。所有配置文件 MUST 从 .env 读取，禁止硬编码。

  - id: R012
    version: v2.13
    name: API 路径唯一真源
    severity: BLOCKER
    stage: [stage3, stage4]
    check_script: scripts/check-api-path-source.ps1
    applies_to: [frontend-dev, mock-service]
    description: |
      api-contract.yaml 是前端 service 层、真实后端路由、Mock 服务器的唯一路径真源。
      前端 services/*.ts 请求路径 MUST 从 contract 提取，严禁按 Mock 约定编写。

  # ---- v2.14 规则 ----
  - id: R013
    version: v2.14
    name: UI 数据加载路径必测
    severity: BLOCKER
    stage: [stage3.5, stage4]
    check_script: scripts/check-e2e-headed-ui.ps1
    applies_to: [kf-mvp-test-e2e]
