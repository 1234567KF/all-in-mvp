# 用途：
#   1. 门禁脚本从此文件读取规则定义，无需重复
#   2. Agent 文件通过 rule ID 引用，不再内嵌规则全文
#   3. SKILL.md 通过此表生成精简引用
#
# 新增规则流程：
#   1. 在此文件新增一条 rule 记录
#   2. 编写对应的 check_script（如可自动化）
#   3. 在适用的 agent Constraints 中加一行引用：`@rule:Rxxx`
#   4. 血案写入 PLAYBOOK.md
#
# 辅助资源：
#   - .qoder/rules/quality-gate.md — 非 Stage 流程的强制行为约束 + 审查清单
#   - .qoder/settings.json hooks.PostToolUse — 文件路径 → 门禁技能/子 Agent 自动派发（scripts/quality-gate-hook.ps1）
# ============================================================

